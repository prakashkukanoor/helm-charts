{{- range .Values.routes }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}-route
  namespace: {{ .namespace }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.name }}
      namespace: {{ $.Values.gateway.namespace }}
      sectionName: http
  # hostnames:
  #   - "example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .pathPrefix }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: {{ .urlRewrite.PathPrefix }}
      backendRefs:
        - name: {{ .name }}
          namespace: {{ .namespace }}
          port: 80 
---
{{- end }}
