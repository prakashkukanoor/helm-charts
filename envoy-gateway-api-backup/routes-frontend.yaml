apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: frontend
spec:
  parentRefs:
    - name: external-lb-gateway
      namespace: envoy-gateway-system
      sectionName: http
  # hostnames:
  #   - "example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /frontend-app
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: frontend-app
          namespace: frontend
          port: 80 
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend-app
          namespace: frontend
          port: 80
